name: Linux AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - feature/linux-desktop-appimage
    paths:
      - '.github/workflows/linux-appimage.yml'
      - 'desktop/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'

permissions:
  contents: read

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes file desktop-file-utils libfuse2t64

      - name: Verify desktop host compiles
        run: ./gradlew --no-daemon :desktop:compileKotlin

      - name: Build distributable Linux application
        run: ./gradlew --no-daemon :desktop:packageDeb

      - name: Locate Debian package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find desktop/build/compose/binaries/main/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [ -z "$deb" ]; then
            echo "::error::Gradle finished but no .deb was produced."
            find desktop/build/compose -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "deb=$deb" >> "$GITHUB_OUTPUT"

      - name: Create AppDir from package
        env:
          DEB_PATH: ${{ steps.package.outputs.deb }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p AppDir
          dpkg-deb -x "$DEB_PATH" AppDir
          desktop_file="$(find AppDir -type f -path '*/usr/share/applications/*.desktop' -print -quit)"
          if [ -z "$desktop_file" ]; then
            echo "::error::The Debian package did not include a desktop launcher."
            exit 1
          fi

          install -m 0644 "$desktop_file" AppDir/BitChord.desktop
          exec_name="$(sed -n 's/^Exec=\([^ ]*\).*/\1/p' "$desktop_file" | head -n1)"
          if [ -z "$exec_name" ]; then
            echo "::error::No Exec entry found in $desktop_file"
            exit 1
          fi
          case "$exec_name" in
            /*) target="AppDir$exec_name" ;;
            *) target="$(find AppDir -type f -path "*/$exec_name" -print -quit)" ;;
          esac
          if [ -z "$target" ] || [ ! -f "$target" ]; then
            echo "::error::Could not resolve packaged executable '$exec_name'."
            exit 1
          fi
          relative_target="${target#AppDir/}"
          printf '#!/usr/bin/env bash\\nset -euo pipefail\\nHERE="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"\\nexec "$HERE/%s" "$@"\\n' "$relative_target" > AppDir/AppRun
          chmod 0755 AppDir/AppRun
          install -m 0644 Logo.png AppDir/BitChord.png

      - name: Download appimagetool
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output appimagetool
          chmod +x appimagetool
          file appimagetool

      - name: Build AppImage
        env:
          ARCH: x86_64
        run: |
          set -euo pipefail
          ./appimagetool --appimage-extract
          ./squashfs-root/AppRun AppDir BitChord-linux-x86_64.AppImage
          chmod +x BitChord-linux-x86_64.AppImage
          file BitChord-linux-x86_64.AppImage
          sha256sum BitChord-linux-x86_64.AppImage > BitChord-linux-x86_64.AppImage.sha256

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-linux-x86_64-AppImage
          path: |
            BitChord-linux-x86_64.AppImage
            BitChord-linux-x86_64.AppImage.sha256
          if-no-files-found: error
